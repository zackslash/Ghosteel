name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
      rpm_changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG" ]; then
            echo "Invalid tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            --jq '.body')
          DELIMITER=$(openssl rand -hex 12)
          echo "release_notes<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"
      - id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          DELIMITER=$(openssl rand -hex 12)
          echo "changelog<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive


      - name: Fix apt cache permissions
        run: sudo chown -R $(id -u):$(id -g) /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-qt5-${{ hashFiles('.github/workflows/release.yaml') }}
          restore-keys: |
            apt-${{ runner.os }}-qt5-

      - name: Install Qt5 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtdeclarative5-dev qt5-qmake cmake build-essential

      - name: Fix apt cache permissions
        run: |
          sudo chown -R $(id -u):$(id -g) /var/cache/apt/archives
          sudo rm -rf /var/cache/apt/archives/partial

      - name: Build tests
        run: |
          cd tests
          cmake -B build
          cmake --build build -j$(nproc)

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd tests/build
          ctest --output-on-failure

  build:
    name: Build (${{ matrix.variant }}/${{ matrix.arch }})
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            arch: armv7hl
          - variant: full
            arch: aarch64
          - variant: full
            arch: i486
          # Store (Jolla Harbour) variant: sandboxed build, real devices only
          - variant: store
            arch: armv7hl
          - variant: store
            arch: aarch64
    env:
      ZIG_VERSION: 0.17.0
      # Store builds use the 5.1 toolchain: its glibc (>= 2.34) folds
      # libutil into libc, so forkpty does not add a libutil.so.1 NEEDED
      # entry the Harbour validator rejects. Full (Chum) builds stay on
      # 5.0 for wider device compatibility.
      SDK_IMAGE: ${{ matrix.variant == 'store' && '5.1.0.11' || '5.0.0.43' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet
          sudo docker image prune -af 2>/dev/null || true

      - uses: actions/checkout@v6

      - name: Select spec (mb2 autodiscovers rpm/*.spec; keep exactly one)
        run: |
          if [ "${{ matrix.variant }}" = "store" ]; then
            mv rpm/ghosteel.spec /tmp/full-spec.spec
            echo "SPEC=rpm/harbour-ghosteel.spec" >> "$GITHUB_ENV"
            echo "CHANGES=rpm/harbour-ghosteel.changes" >> "$GITHUB_ENV"
          else
            mv rpm/harbour-ghosteel.spec /tmp/store-spec.spec
            echo "SPEC=rpm/ghosteel.spec" >> "$GITHUB_ENV"
            echo "CHANGES=rpm/ghosteel.changes" >> "$GITHUB_ENV"
          fi

      - name: Get Ghostty submodule commit
        id: ghostty-commit
        run: |
          SHA=$(git ls-tree HEAD ghostty | awk '{print $3}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt (+ store busybox)
        id: cache-lib
        uses: actions/cache@v4
        with:
          path: lib/${{ matrix.arch }}
          key: libghostty-vt-${{ matrix.arch }}-${{ steps.ghostty-commit.outputs.sha }}-zig-${{ env.ZIG_VERSION }}-buildlibs-${{ hashFiles('scripts/build-libs.sh') }}-busybox-${{ hashFiles('rpm/busybox-*.tar.bz2') }}

      - name: Cache Ghostty submodule
        id: cache-submodule
        uses: actions/cache@v4
        with:
          path: .git/modules/ghostty
          key: submodule-ghostty-${{ steps.ghostty-commit.outputs.sha }}
          restore-keys: |
            submodule-ghostty-

      - name: Initialize Ghostty submodule
        run: git submodule update --init --recursive


      - name: Set version from tag
        run: |
          VER="${{ needs.validate.outputs.version }}"
          RPM_VER=$(echo "$VER" | sed 's/-/~/g')
          echo "Setting version to $VER (RPM: $RPM_VER)"

          sed -i "s/^Version:.*/Version:    $RPM_VER/" "$SPEC"

          # .pro fallback for GIT_VERSION — safe to only replace fallback because
          # the main repo's git describe works inside Docker (not cached like submodule)
          sed -i "s/isEmpty(GIT_VERSION): GIT_VERSION = \"[^\"]*\"/isEmpty(GIT_VERSION): GIT_VERSION = \"$VER\"/" ghosteel.pro

      - name: Cache Zig
        if: steps.cache-lib.outputs.cache-hit != 'true'
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: /opt/zig-x86_64-linux-${{ env.ZIG_VERSION }}
          key: zig-${{ env.ZIG_VERSION }}-linux-x86_64

      - name: Install Zig
        if: steps.cache-lib.outputs.cache-hit != 'true' && steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /opt

      - name: Add Zig to PATH
        if: steps.cache-lib.outputs.cache-hit != 'true'
        run: echo "/opt/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Build libghostty-vt
        if: steps.cache-lib.outputs.cache-hit != 'true'
        run: bash scripts/build-libs.sh ${{ matrix.arch }}

      - name: Generate changelog
        env:
          CHANGELOG: ${{ needs.validate.outputs.rpm_changelog }}
        run: |
          DATE=$(date "+%a %b %d %Y")
          VER="${{ needs.validate.outputs.version }}"
          printf '* %s - %s\n%s\n' "$DATE" "$VER" "$CHANGELOG" > "$CHANGES"

      - name: Cache Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/sfos-sdk.tar
          key: sfos-sdk-${{ env.SDK_IMAGE }}

      - name: Load Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/sfos-sdk.tar
          rm -f /tmp/sfos-sdk.tar

      - name: Build RPM
        uses: coderus/github-sfos-build@sfos5
        with:
          release: ${{ env.SDK_IMAGE }}
          arch: ${{ matrix.arch }}

      - name: Harbour validator gate (store build)
        if: matrix.variant == 'store'
        run: |
          # Run Jolla's store RPM validator against the store RPM inside the
          # same SDK image. Exit codes: 0 pass, 1 fail, 2 pass with warnings.
          RPM_PATH=$(ls RPMS/*.rpm | head -1)
          if [ -z "$RPM_PATH" ]; then
            echo "::error::no RPM found to validate"
            exit 1
          fi
          git clone --quiet --depth 1 \
            https://github.com/sailfishos/sdk-harbour-rpmvalidator.git /tmp/validator
          set +e
          docker run --rm -v "$PWD":/build -v /tmp/validator:/validator:ro \
            coderus/sailfishos-platform-sdk:${{ env.SDK_IMAGE }} \
            bash /validator/rpmvalidation.sh -c "/build/$RPM_PATH"
          RC=$?
          set -e
          echo "validator exit code: $RC"
          if [ "$RC" -ne 0 ] && [ "$RC" -ne 2 ]; then
            echo "::error::Harbour validation failed (exit $RC)"
            exit 1
          fi

      - name: Save Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker save coderus/sailfishos-platform-sdk:${{ env.SDK_IMAGE }} -o /tmp/sfos-sdk.tar

      - name: Upload RPM
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.variant }}-ghosteel-${{ matrix.arch }}
          path: RPMS/*.rpm
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v6
        with:
          path: release-rpms

      - name: Compose release body
        id: body
        env:
          NOTES: ${{ needs.validate.outputs.release_notes }}
        run: |
          {
            echo "body<<DELIM"
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "**Packages:** \`ghosteel-<version>-<arch>.rpm\` is the full version (system shell, installed apps, desktop shortcuts). \`harbour-ghosteel-<version>-<arch>.rpm\` is the sandboxed Jolla Store build; it runs in its own restricted environment with bundled busybox tools, cannot see system apps or most of your folders, and has no root access. Install it from the Jolla Store, or directly only if you specifically want the sandboxed variant."
            echo "DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Ghosteel v${{ needs.validate.outputs.version }}
          body: ${{ steps.body.outputs.body }}
          files: release-rpms/**/*.rpm
