name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
      rpm_changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG" ]; then
            echo "Invalid tag: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ github.ref_name }}" \
            --jq '.body')
          DELIMITER=$(openssl rand -hex 12)
          echo "release_notes<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"
      - id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          DELIMITER=$(openssl rand -hex 12)
          echo "changelog<<$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply Ghosteel patches to Ghostty
        run: |
          for patch in patches/*.patch; do
            [ -f "$patch" ] && git -C ghostty apply --check "$GITHUB_WORKSPACE/$patch" && git -C ghostty apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Fix apt cache permissions
        run: sudo chown -R $(id -u):$(id -g) /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-qt5-${{ hashFiles('.github/workflows/release.yaml') }}
          restore-keys: |
            apt-${{ runner.os }}-qt5-

      - name: Install Qt5 dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qt5-qmake cmake build-essential

      - name: Fix apt cache permissions
        run: |
          sudo chown -R $(id -u):$(id -g) /var/cache/apt/archives
          sudo rm -rf /var/cache/apt/archives/partial

      - name: Build tests
        run: |
          cd tests
          cmake -B build
          cmake --build build -j$(nproc)

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd tests/build
          ctest --output-on-failure

  build:
    name: Build (${{ matrix.arch }})
    needs: [validate, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7hl, aarch64, i486]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet
          sudo docker image prune -af 2>/dev/null || true

      - uses: actions/checkout@v6

      - name: Get Ghostty submodule commit
        id: ghostty-commit
        run: |
          SHA=$(git ls-tree HEAD ghostty | awk '{print $3}')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libghostty-vt
        id: cache-lib
        uses: actions/cache@v4
        with:
          path: lib/${{ matrix.arch }}
          key: libghostty-vt-${{ matrix.arch }}-${{ steps.ghostty-commit.outputs.sha }}-${{ hashFiles('patches/*.patch') }}

      - name: Cache Ghostty submodule
        id: cache-submodule
        uses: actions/cache@v4
        with:
          path: .git/modules/ghostty
          key: submodule-ghostty-${{ steps.ghostty-commit.outputs.sha }}
          restore-keys: |
            submodule-ghostty-

      - name: Initialize Ghostty submodule
        run: git submodule update --init --recursive

      - name: Apply Ghosteel patches to Ghostty
        run: |
          for patch in patches/*.patch; do
            [ -f "$patch" ] && git -C ghostty apply --check "$GITHUB_WORKSPACE/$patch" && git -C ghostty apply "$GITHUB_WORKSPACE/$patch"
          done

      - name: Set version from tag
        run: |
          VER="${{ needs.validate.outputs.version }}"
          RPM_VER=$(echo "$VER" | sed 's/-/~/g')
          echo "Setting version to $VER (RPM: $RPM_VER)"

          # RPM spec version
          sed -i "s/^Version:.*/Version:    $RPM_VER/" rpm/ghosteel.spec

          # .pro fallback for GIT_VERSION (CI tarball has no .git)
          sed -i "s/isEmpty(GIT_VERSION): GIT_VERSION = \"[^\"]*\"/isEmpty(GIT_VERSION): GIT_VERSION = \"$VER\"/" ghosteel.pro

          # .pro fallback for GHOSTTY_VERSION (submodule commit hash)
          if [ -f ghostty/.git ]; then
            GHOSTTY_VER=$(cd ghostty && git describe --tags --always 2>/dev/null || echo "unknown")
          else
            GHOSTTY_VER="${{ steps.ghostty-commit.outputs.sha }}"
          fi
          sed -i "s/isEmpty(GHOSTTY_VERSION): GHOSTTY_VERSION = \"[^\"]*\"/isEmpty(GHOSTTY_VERSION): GHOSTTY_VERSION = \"$GHOSTTY_VER\"/" ghosteel.pro

      - name: Cache Zig
        if: steps.cache-lib.outputs.cache-hit != 'true'
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: /opt/zig-x86_64-linux-0.15.2
          key: zig-0.15.2-linux-x86_64

      - name: Install Zig
        if: steps.cache-lib.outputs.cache-hit != 'true' && steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          ZIG_VERSION=0.15.2
          curl -L "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /opt

      - name: Add Zig to PATH
        if: steps.cache-lib.outputs.cache-hit != 'true'
        run: echo "/opt/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"

      - name: Build libghostty-vt
        if: steps.cache-lib.outputs.cache-hit != 'true'
        run: bash scripts/build-libs.sh ${{ matrix.arch }}

      - name: Generate changelog
        env:
          CHANGELOG: ${{ needs.validate.outputs.rpm_changelog }}
        run: |
          DATE=$(date "+%a %b %d %Y")
          VER="${{ needs.validate.outputs.version }}"
          printf '* %s - %s\n%s\n' "$DATE" "$VER" "$CHANGELOG" > rpm/ghosteel.changes

      - name: Cache Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/sfos-sdk.tar
          key: sfos-sdk-5.0.0.43

      - name: Load Docker image
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/sfos-sdk.tar
          rm -f /tmp/sfos-sdk.tar

      - name: Build RPM
        uses: coderus/github-sfos-build@sfos5
        with:
          release: 5.0.0.43
          arch: ${{ matrix.arch }}

      - name: Save Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: docker save coderus/sailfishos-platform-sdk:5.0.0.43 -o /tmp/sfos-sdk.tar

      - name: Upload RPM
        uses: actions/upload-artifact@v6
        with:
          name: ghosteel-${{ matrix.arch }}
          path: RPMS/*.rpm
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v6
        with:
          path: release-rpms

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Ghosteel v${{ needs.validate.outputs.version }}
          body: ${{ needs.validate.outputs.release_notes }}
          files: release-rpms/**/*.rpm
