# Ghosteel's bell feedback events for ngfd.
# Installed to /usr/share/ngfd/events.d/ by the ghosteel RPM; removing the
# package removes these. ngfd reads this directory at daemon start only.
# The stock "vibra" event (double-pulse "notice") is the vibrate fallback
# where this file is absent; sound has no fallback (it was silent before).

[ghosteel_bell_vibrate]
haptic.type = event
haptic.effect = strong

[ghosteel_bell_sound]
canberra.filename = general_warning
