# Bell feedback events for Ghosteel (played by src/bellfeedback.cpp).
# ngfd reads this directory at daemon start only.

[ghosteel_bell_vibrate]
haptic.type = event
haptic.effect = strong

[ghosteel_bell_sound]
canberra.filename = general_warning
# Mirror stock general_warning gating: obey system sound level and silent mode.
sound.volume.profile = system.sound.level => sound.volume
sound.stream.media.name = system-event
sound.stream.module-stream-restore.id = x-system-sound-level
